#cloud-config
# Jinja2 : dnn, ue_subnet, n3_ip, n4_ip fournis par additionalParamsForVnf
hostname: upf-{{ dnn }}
package_update: true
packages:
  - ca-certificates
  - gnupg
  - iperf3
  - iptables
write_files:
  - path: /etc/open5gs/upf.yaml
    content: |
      logger:
        file: /var/log/open5gs/upf.log
      global:
        max:
          ue: 128
      upf:
        pfcp:
          server:
            - address: {{ n4_ip }}
        gtpu:
          server:
            - address: {{ n3_ip }}
        session:
          - subnet: {{ ue_subnet }}
            gateway: {{ ue_gateway }}
            dnn: {{ dnn }}
        metrics:
          server:
            - address: 0.0.0.0
              port: 9090
runcmd:
  - add-apt-repository -y ppa:open5gs/latest
  - apt-get update
  - apt-get install -y open5gs-upf
  # NAT du trafic UE vers N6 (plateforme edge)
  - sysctl -w net.ipv4.ip_forward=1
  - iptables -t nat -A POSTROUTING -s {{ ue_subnet }} ! -o ogstun -j MASQUERADE
  - systemctl restart open5gs-upfd
  - systemctl enable open5gs-upfd
