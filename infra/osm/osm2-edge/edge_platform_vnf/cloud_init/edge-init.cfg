#cloud-config
# Jinja2 : repo_url (depot git contenant apps/), public_ip (IP N6 exposee aux UE/expert)
hostname: edge-platform
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - iperf3
write_files:
  - path: /opt/edge-video/index.html
    content: |
      <!-- Application edge de substitution (edge-video) du banc -->
      <html><body><h1>edge-video OK</h1>
      <video controls src="/sample.mp4"></video></body></html>
runcmd:
  # Docker
  - curl -fsSL https://get.docker.com | sh
  # Pile metavers (apps/ de ce depot)
  - git clone {{ repo_url }} /opt/fieldassist
  - cp /opt/fieldassist/apps/deploy/env.example /opt/fieldassist/apps/deploy/.env
  - sed -i "s/^PUBLIC_HOST=.*/PUBLIC_HOST={{ public_ip }}/" /opt/fieldassist/apps/deploy/.env
  - cd /opt/fieldassist/apps && docker compose --env-file deploy/.env up -d --build
  # edge-video (substitution minimale du banc) sur :8081
  - docker run -d --name edge-video --restart unless-stopped -p 8081:80 -v /opt/edge-video:/usr/share/nginx/html:ro nginx:alpine
