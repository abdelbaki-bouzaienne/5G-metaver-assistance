#cloud-config
# Jinja2 : variables fournies par additionalParamsForVnf (voir params/ran_params.yaml)
hostname: gnb-ran
package_update: true
packages:
  - make
  - gcc
  - g++
  - cmake
  - libsctp-dev
  - lksctp-tools
  - iproute2
  - iperf3
write_files:
  - path: /opt/ueransim-conf/gnb.yaml
    content: |
      mcc: '{{ mcc }}'
      mnc: '{{ mnc }}'
      nci: '0x000000010'
      idLength: 32
      tac: 1
      linkIp: 127.0.0.1
      ngapIp: {{ n2_ip }}
      gtpIp: {{ n3_ip }}
      amfConfigs:
        - address: {{ amf_ip }}
          port: 38412
      slices:
        - sst: 1
          sd: 657502
        - sst: 2
          sd: 791515
      ignoreStreamIds: true
  - path: /opt/ueransim-conf/ue-embb.yaml
    content: |
      supi: 'imsi-{{ mcc }}{{ mnc }}0000000001'
      mcc: '{{ mcc }}'
      mnc: '{{ mnc }}'
      protectionScheme: 0
      key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
      op: 'E8ED289DEBA952E4283B54E88E6183CA'
      opType: 'OPC'
      amf: '8000'
      imei: '356938035643803'
      imeiSv: '4370816125816151'
      gnbSearchList:
        - 127.0.0.1
      uacAic: {mps: false, mcs: false}
      uacAcc: {normalClass: 0, class11: false, class12: false, class13: false, class14: false, class15: false}
      sessions:
        - type: 'IPv4'
          apn: 'EDGE'
          slice: {sst: 1, sd: 657502}
      configured-nssai:
        - {sst: 1, sd: 657502}
      default-nssai:
        - {sst: 1, sd: 657502}
      integrity: {IA1: true, IA2: true, IA3: true}
      ciphering: {EA1: true, EA2: true, EA3: true}
      integrityMaxRate: {uplink: 'full', downlink: 'full'}
  - path: /opt/ueransim-conf/ue-urllc.yaml
    content: |
      supi: 'imsi-{{ mcc }}{{ mnc }}0000000002'
      mcc: '{{ mcc }}'
      mnc: '{{ mnc }}'
      protectionScheme: 0
      key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
      op: 'E8ED289DEBA952E4283B54E88E6183CA'
      opType: 'OPC'
      amf: '8000'
      imei: '356938035643804'
      imeiSv: '4370816125816152'
      gnbSearchList:
        - 127.0.0.1
      uacAic: {mps: false, mcs: false}
      uacAcc: {normalClass: 0, class11: false, class12: false, class13: false, class14: false, class15: false}
      sessions:
        - type: 'IPv4'
          apn: 'actuation'
          slice: {sst: 2, sd: 791515}
      configured-nssai:
        - {sst: 2, sd: 791515}
      default-nssai:
        - {sst: 2, sd: 791515}
      integrity: {IA1: true, IA2: true, IA3: true}
      ciphering: {EA1: true, EA2: true, EA3: true}
      integrityMaxRate: {uplink: 'full', downlink: 'full'}
  - path: /etc/systemd/system/ueransim-gnb.service
    content: |
      [Unit]
      Description=UERANSIM gNB
      After=network-online.target
      [Service]
      ExecStart=/opt/UERANSIM/build/nr-gnb -c /opt/ueransim-conf/gnb.yaml
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
runcmd:
  - git clone --depth 1 --branch v3.2.6 https://github.com/aligungr/UERANSIM /opt/UERANSIM
  - cd /opt/UERANSIM && make -j2
  - systemctl daemon-reload
  - systemctl enable --now ueransim-gnb
  # Les UE (nr-ue) sont lances a la demande par les tests :
  #   /opt/UERANSIM/build/nr-ue -c /opt/ueransim-conf/ue-embb.yaml
  #   /opt/UERANSIM/build/nr-ue -c /opt/ueransim-conf/ue-urllc.yaml
