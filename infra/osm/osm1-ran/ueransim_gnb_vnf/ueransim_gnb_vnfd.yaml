vnfd:
  id: ueransim_gnb_vnf
  product-name: ueransim_gnb_vnf
  description: >
    gNB + UE simules (UERANSIM) pour le site d'intervention (d1 / PE-RAN).
    Porte les deux S-NSSAI du PoC (eMBB 1:657502, URLLC 2:791515) et les DNN EDGE / actuation.
  provider: fieldassist-poc
  version: '1.0'
  mgmt-cp: mgmt-ext
  virtual-compute-desc:
    - id: gnb-compute
      virtual-cpu:
        num-virtual-cpu: 2
      virtual-memory:
        size: 4.0
  virtual-storage-desc:
    - id: gnb-storage
      size-of-storage: 20
  sw-image-desc:
    - id: ubuntu-22.04
      name: ubuntu-22.04
      image: ubuntu-22.04
  vdu:
    - id: gnb-vdu
      name: gnb-vdu
      description: VM UERANSIM (gNB nr-gnb + UE nr-ue)
      cloud-init-file: gnb-init.cfg
      sw-image-desc: ubuntu-22.04
      virtual-compute-desc: gnb-compute
      virtual-storage-desc:
        - gnb-storage
      int-cpd:
        - id: mgmt-int
          virtual-network-interface-requirement:
            - name: ens3
              position: 1
              virtual-interface:
                type: PARAVIRT
        - id: n2-int
          virtual-network-interface-requirement:
            - name: ens4
              position: 2
              virtual-interface:
                type: PARAVIRT
        - id: n3-int
          virtual-network-interface-requirement:
            - name: ens5
              position: 3
              virtual-interface:
                type: PARAVIRT
  ext-cpd:
    - id: mgmt-ext
      int-cpd:
        vdu-id: gnb-vdu
        cpd: mgmt-int
    - id: n2-ext
      int-cpd:
        vdu-id: gnb-vdu
        cpd: n2-int
    - id: n3-ext
      int-cpd:
        vdu-id: gnb-vdu
        cpd: n3-int
  df:
    - id: default-df
      vdu-profile:
        - id: gnb-vdu
          min-number-of-instances: 1
          max-number-of-instances: 1
      instantiation-level:
        - id: default-instantiation-level
          vdu-level:
            - vdu-id: gnb-vdu
              number-of-instances: 1
      default-instantiation-level: default-instantiation-level
