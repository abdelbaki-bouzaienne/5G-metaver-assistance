worker_processes auto;
events { worker_connections 1024; }
http {
  client_max_body_size 200m;          # chunks de scan (F1)
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8000;

    # En production : terminer TLS ici + validation OIDC (auth_request vers Keycloak)

    location /twin/     { proxy_pass http://twin-service:8001/; }
    location /ingest/   { proxy_pass http://scan-ingest:8002/; }
    location /pipeline/ { proxy_pass http://gs-pipeline:8003/; }
    location /session/  { proxy_pass http://session-service:8004/; }
    location /actuation/ { proxy_pass http://actuation-controller:8006/; }

    location /signaling/ {
      proxy_pass http://signaling:8005/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location /healthz { return 200 '{"status":"ok","service":"gateway"}'; add_header Content-Type application/json; }
  }
}
