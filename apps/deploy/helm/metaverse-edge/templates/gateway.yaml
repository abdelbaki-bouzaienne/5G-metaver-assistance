---
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway-config}
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      client_max_body_size 200m;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen {{ .Values.gateway.port }};
        location /twin/      { proxy_pass http://twin-service:8001/; }
        location /ingest/    { proxy_pass http://scan-ingest:8002/; }
        location /pipeline/  { proxy_pass http://gs-pipeline:8003/; }
        location /session/   { proxy_pass http://session-service:8004/; }
        location /actuation/ { proxy_pass http://actuation-controller:8006/; }
        location /signaling/ {
          proxy_pass http://signaling:8005/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
        }
        location /healthz { return 200 '{"status":"ok","service":"gateway"}'; add_header Content-Type application/json; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports: [{containerPort: {{ .Values.gateway.port }}}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
      volumes:
        - name: conf
          configMap: {name: gateway-config}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  type: {{ .Values.gateway.serviceType }}
  selector: {app: gateway}
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
