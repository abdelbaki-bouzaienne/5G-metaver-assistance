# coturn - TURN/STUN pour la session collaborative (ADR 7 : TURN des la V1).
# Identifiants ephemeres emis par session-service (HMAC du secret partage).
listening-port=3478
tls-listening-port=443
# Repli TCP/443 quand l'UDP est bloque par les pare-feu d'entreprise
use-auth-secret
static-auth-secret=changeme-turn-secret
realm=fieldassist.local
fingerprint
lt-cred-mech
no-multicast-peers
# Plage de relais (a ouvrir dans les security groups OpenStack)
min-port=49152
max-port=49300
verbose
